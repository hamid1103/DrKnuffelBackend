name: Build, Test and Deploy a .NET Core WebApi to Azure App Service

env: 
  ARTIFACT_NAME: WebApi
  DOTNET_CORE_VERSION: 10.0.x
  PUBLISH_DIRECTORY: "./out/publish"

on:
  push:
    branches:
      - main
      - deployment
      - master
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
    steps:
      - name: Check if CONNECTION_STRING exists
        if: ${{ env.CONNECTION_STRING == '' }}
        run: |
          echo "Repository secret 'CONNECTION_STRING' is missing!"
          exit 1

      - name: Check if AZURE_WEBAPP_NAME secret exists
        if: ${{ secrets.AZURE_WEBAPP_NAME == '' }}
        run: |
          echo "Repository secret 'AZURE_WEBAPP_NAME' is missing!"
          exit 1

      - name: Check if AZURE_WEBAPP_PUBLISH_PASSWORD secret exists
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PASSWORD == '' }}
        run: |
          echo "Repository secret 'AZURE_WEBAPP_PUBLISH_PASSWORD' is missing!"
          exit 1

      - name: Check if AZURE_WEBAPP_PUBLISH_USERNAME secret exists
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_USERNAME == '' }}
        run: |
          echo "Repository secret 'AZURE_WEBAPP_PUBLISH_USERNAME' is missing!"
          exit 1

      - name: Check if WEBAPI_PROJECT_FOLDER secret exists
        if: ${{ secrets.WEBAPI_PROJECT_FOLDER == '' }}
        run: |
          echo "Repository secret 'WEBAPI_PROJECT_FOLDER' is missing!"
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore
    
      - name: Test
        run: dotnet test --no-build --verbosity normal
    
      - name: Publish
        run: dotnet publish ./${{ secrets.WEBAPI_PROJECT_FOLDER }} --output ${{ env.PUBLISH_DIRECTORY }} --configuration Release 
    
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}

  deploy:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ env.PUBLISH_DIRECTORY }}'
          clean: true